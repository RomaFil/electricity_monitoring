; Svitlo-Local firmware for NodeMCU (ESP8266, ESP-12E, 4 MB flash)
; Build:  pio run          Flash over USB:  pio run -t upload       Serial log:  pio device monitor
; Flash over Wi-Fi:  pio run -e ota -t upload   (needs secrets.ini, see secrets.ini.example)

[platformio]
default_envs = nodemcuv2
; secrets.ini (git-ignored) holds the OTA password; the pattern does not fail when the file is absent
extra_configs = secrets*.ini

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
; 4 MB flash: ~1 MB for the program (+ the same for OTA), 1 MB for LittleFS (settings)
board_build.ldscript = eagle.flash.4m1m.ld
board_build.filesystem = littlefs
; 160 MHz makes the TLS handshake about twice as fast
board_build.f_cpu = 160000000L
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
upload_speed = 460800
lib_deps =
    bblanchon/ArduinoJson@7.2.1
    adafruit/RTClib@2.1.4
    adafruit/Adafruit BME280 Library@2.2.4
    adafruit/Adafruit BMP280 Library@2.6.8
; public.key -> firmware, firmware.bin -> firmware.bin.signed (remote updates, see signing.py)
extra_scripts = pre:signing.py
build_flags =
    -D FW_VERSION=\"0.8.1\"

; Same firmware, uploaded through the board's /update page instead of USB
[env:ota]
extends = env:nodemcuv2
upload_protocol = custom
extra_scripts = pre:signing.py, ota_upload.py
