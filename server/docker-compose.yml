name: svitlo-local

services:
  web:
    build: .
    image: svitlo-local:latest
    container_name: svitlo-web
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/svitlo.db
    volumes:
      - svitlo-data:/data
    # Адреса прив'язки береться з .env. Типово 127.0.0.1 — без явного
    # налаштування сервіс НЕ виставляється в мережу. Для доступу лише через
    # WireGuard вкажи адресу тунелю (10.0.0.1).
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-3003}:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/status',timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s

  poller:
    build: .
    image: svitlo-local:latest
    container_name: svitlo-poller
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/svitlo.db
    volumes:
      - svitlo-data:/data
    command: ["python", "-m", "app.poller"]
    depends_on:
      - web

volumes:
  svitlo-data:
